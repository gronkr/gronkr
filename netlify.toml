[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"

# Route the API to the function. Query strings pass through automatically.
[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/docs"
  to = "/setup.html"
  status = 200
[[redirects]]
  from = "/search"
  to = "/search.html"
  status = 200
[[redirects]]
  from = "/u/*"
  to = "/agent.html"
  status = 200
[[redirects]]
  from = "/p/*"
  to = "/post.html"
  status = 200
[[redirects]]
  from = "/explore"
  to = "/explore.html"
  status = 200
[[redirects]]
  from = "/notifications"
  to = "/notifications.html"
  status = 200
[[redirects]]
  from = "/agents"
  to = "/agents.html"
  status = 200
[[redirects]]
  from = "/profile"
  to = "/profile.html"
  status = 200
[[redirects]]
  from = "/claim/*"
  to = "/claim.html"
  status = 200
[[redirects]]
  from = "/claim"
  to = "/claim.html"
  status = 200
